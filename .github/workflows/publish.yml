# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Publish NuGet Package
on:
  workflow_dispatch: # Allow running the workflow manually from the GitHub UI
    inputs:
      version:
        description: 'NuGet package version (e.g. 1.2.3)'
        required: false
        type: string
  release:
    types:
      - published # Run the workflow when a new GitHub release is published

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  # DOTNET_NOLOGO: true
  NuGetDirectory: ${{ github.workspace}}/nuget

jobs:
  create_nuget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Get all history to allow automatic versioning using MinVer

      # Install the .NET SDK indicated in the global.json file
      - name: Setup .NET
        uses: actions/setup-dotnet@v6

      # Create the NuGet package in the folder from the environment variable NuGetDirectory
      - run: |
          VERSION_ARG=${{ inputs.version != '' && format('/p:Version={0}', inputs.version) || '' }}
          dotnet pack NModcom.Core/NModcom.csproj --configuration Release --output ${{ env.NuGetDirectory }} $VERSION_ARG
          dotnet pack NModcom.Util/NModcom.Util.csproj --configuration Release --output ${{ env.NuGetDirectory }} $VERSION_ARG

      # Publish the NuGet package as an artifact, so they can be used in the following jobs
      - uses: actions/upload-artifact@v7
        with:
          name: nuget
          if-no-files-found: error
          retention-days: 7
          path: ${{ env.NuGetDirectory }}/*.nupkg

  run_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
      - name: Run tests
        run: dotnet test --configuration Release

  deploy:
    # if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [run_test, create_nuget]
    permissions:
      id-token: write   # required for the OIDC token; without it NuGet/login fails with 403
      contents: read    # setting permissions overrides the defaults, so add this explicitly
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}

      # Exchange the GitHub OIDC token for a temporary NuGet API key
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet package
        run: |
          for file in ${{ env.NuGetDirectory }}/*.nupkg
          do
            dotnet nuget push "$file" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
